<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-labelledby="title desc">
<title id="title">Egbuchulam Chinedu Miracle — Founder Engineering Console</title>
<desc id="desc">Animated signal grid connecting strategy, backend engineering, artificial intelligence, security and product delivery.</desc>
<style>
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .grid{stroke:#17324a;stroke-width:1;opacity:.45}
  .node{fill:#071521;stroke:#2dd4bf;stroke-width:2}
  .signal{fill:none;stroke:#2dd4bf;stroke-width:2;stroke-dasharray:8 12;animation:flow 4s linear infinite}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-in-out infinite}
  .reveal{opacity:0;animation:reveal .55s ease-out forwards}
  .r2{animation-delay:.18s}.r3{animation-delay:.36s}.r4{animation-delay:.54s}.r5{animation-delay:.72s}
  @keyframes flow{to{stroke-dashoffset:-40}}
  @keyframes pulse{0%,100%{opacity:.45;transform:scale(.92)}50%{opacity:1;transform:scale(1.12)}}
  @keyframes reveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.reveal{opacity:1}}
</style>
<rect width="860" height="330" rx="18" fill="#050b12"/>
