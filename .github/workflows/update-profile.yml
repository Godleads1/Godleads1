name: Update profile telemetry

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_contributions.py"
      - "scripts/render_contributions.py"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-telemetry
  cancel-in-progress: false

jobs:
  contribution-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Fetch public contribution calendar
        run: python scripts/fetch_contributions.py

      - name: Render first-party SVG
        run: python scripts/render_contributions.py

      - name: Commit changed telemetry
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$(git status --porcelain --untracked-files=all -- data/contributions.json assets/contributions.svg)" ]]; then
            echo "Contribution telemetry is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/contributions.svg
          git commit -m "chore: refresh profile telemetry [skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
